name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      REPORT_CRON: "* * * * *"
      EXPECT_SCHEDULE: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          {
            node-version: "22",
            cache: npm,
            cache-dependency-path: backend/package-lock.json,
          }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: npm ci
        working-directory: backend
      - run: mkdir -p docs/runs
      - run: npm run lint && npm test && npm run build
        working-directory: backend
      - run: pip install -r llm-service/requirements.txt
      - run: ruff check llm-service && pytest -q llm-service --junitxml=docs/runs/pytest.xml
      - run: node tests/setup.mjs
      - id: stack
        run: docker compose up -d --build --wait --wait-timeout 240
      - run: sh tests/smoke.sh
      - run: npx playwright install --with-deps chromium
        working-directory: backend
      - run: node backend/tests/ui.mjs
      - run: node tests/evaluate.mjs
        if: always() && steps.stack.outcome == 'success'
      - name: Export the workflows from the running n8n instance
        if: always() && steps.stack.outcome == 'success'
        run: |
          docker compose exec -T n8n n8n export:workflow --all --output=/tmp/workflows-export.json
          docker compose cp n8n:/tmp/workflows-export.json docs/runs/workflows-export.json
      - name: Run local Ollama model and evaluate compatible API
        if: always() && steps.stack.outcome == 'success'
        run: |
          docker compose --profile ollama up -d --wait ollama
          docker compose exec -T ollama ollama pull qwen2.5:0.5b
          LLM_MODE=ollama docker compose up -d --no-deps --wait llm
          node tests/evaluate.mjs
          node tests/ollama-smoke.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: execution-evidence, path: docs/runs/ }
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose --profile ollama down -v
        if: always()
