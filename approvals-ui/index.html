<!doctype html>
<html lang="en">
  <meta charset="utf-8" /><title>Order approvals</title>
  <style>
    body {
      font: 16px system-ui;
      max-width: 850px;
      margin: 40px auto;
      background: #f4f6fa;
      color: #142438;
    }
    article {
      background: white;
      padding: 20px;
      margin: 15px 0;
      border-radius: 12px;
    }
    button,
    input {
      padding: 10px;
      margin: 6px;
    }
    pre {
      white-space: pre-wrap;
    }
    #status {
      color: #37465b;
    }
  </style>
  <h1>Human review queue</h1>
  <p>
    Review the order and model output before deciding. Keys stay in memory for
    this page session.
  </p>
  <label>API key <input id="key" type="password" autocomplete="off" /></label
  ><button id="load">Load approvals</button>
  <p id="status" role="status"></p>
  <main id="queue"></main>
  <script>
    const status = document.getElementById("status");
    async function request(path, body) {
      const r = await fetch(path, {
        method: body ? "POST" : "GET",
        headers: {
          "x-api-key": document.getElementById("key").value,
          "Content-Type": "application/json",
        },
        body: body ? JSON.stringify(body) : undefined,
      });
      const data = await r.json();
      if (!r.ok) throw Error(data.error);
      return data;
    }
    async function load() {
      try {
        const rows = await request("/approvals");
        document.getElementById("queue").replaceChildren();
        for (const row of rows) {
          const card = document.createElement("article");
          const text = document.createElement("pre");
          text.textContent = JSON.stringify(row, null, 2);
          card.append(text);
          for (const decision of ["approved", "rejected"]) {
            const b = document.createElement("button");
            b.textContent = decision;
            b.disabled =
              !row.resumable || (row.decision && row.decision !== decision);
            b.onclick = async () => {
              try {
                b.disabled = true;
                await request("/approvals/" + row.id + "/decision", {
                  decision,
                });
                await load();
              } catch (e) {
                status.textContent = e.message;
                b.disabled = false;
              }
            };
            card.append(b);
          }
          document.getElementById("queue").append(card);
        }
        status.textContent = rows.length + " pending review(s)";
      } catch (e) {
        status.textContent = e.message;
      }
    }
    document.getElementById("load").onclick = load;
  </script>
</html>
