name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: '22', cache: npm, cache-dependency-path: backend/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: npm ci
        working-directory: backend
      - run: npm run lint && npm test && npm run build
        working-directory: backend
      - run: pip install -r llm-service/requirements.txt
      - run: ruff check llm-service && pytest -q llm-service
      - run: node tests/setup.mjs
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: sh tests/smoke.sh
      - run: node tests/evaluate.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: execution-evidence, path: docs/runs/}
      - run: docker compose logs --no-color
        if: failure()
      - run: docker compose down -v
        if: always()
